name: 徽章更新

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: badges
  cancel-in-progress: true

jobs:
  tests-badge:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
      - name: 安装 pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: 配置 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 运行测试（JSON 报告）
        run: pnpm exec vitest run --reporter=json --outputFile=/tmp/vitest-report.json
      - name: 生成测试徽章
        run: node scripts/generate-test-badge.mjs /tmp/vitest-report.json docs/badges/tests.json
      - name: 提交徽章（有变化时）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/badges/tests.json
          git diff --cached --quiet || git commit -m "chore: 更新测试徽章数据"
          git push
